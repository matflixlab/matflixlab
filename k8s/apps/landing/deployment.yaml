apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: matflixlab
  labels:
    app: landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: pdf-dir
          mountPath: /usr/share/nginx/html/cv
      volumes:
      - name: html
        configMap:
          name: landing-html
      - name: pdf-dir
        hostPath:
          path: /home/matflix/matflixlab/cv
          type: DirectoryOrCreate
