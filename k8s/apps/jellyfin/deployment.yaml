apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: matflixlab
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        ports:
        - containerPort: 8096
          name: http
        env:
        - name: TZ
          value: "Europe/Warsaw"
        - name: JELLYFIN_PublishedServerUrl
          value: "http://jellyfin.matflixlab.pl"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1536Mi"
            cpu: "1500m"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
        - name: movies
          mountPath: /media/movies
          readOnly: true
        - name: tv
          mountPath: /media/tv
          readOnly: true
        - name: music
          mountPath: /media/music
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config-pvc
      - name: cache
        emptyDir: {}
      - name: movies
        hostPath:
          path: /home/matflix/matflixlab/media/movies
          type: DirectoryOrCreate
      - name: tv
        hostPath:
          path: /home/matflix/matflixlab/media/tv
          type: DirectoryOrCreate
      - name: music
        hostPath:
          path: /home/matflix/matflixlab/media/music
          type: DirectoryOrCreate
