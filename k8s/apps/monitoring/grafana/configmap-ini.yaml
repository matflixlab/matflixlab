apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ini
  namespace: monitoring
data:
  grafana.ini: |
    [server]
    root_url = https://grafana.matflixlab.pl

    [auth.anonymous]
    enabled = true
    org_name = Main Org.
    org_role = Viewer

    [security]
    allow_embedding = true

    [users]
    allow_sign_up = false
    default_theme = dark
