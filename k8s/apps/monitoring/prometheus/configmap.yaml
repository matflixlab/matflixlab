apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      # k3s API server + kubelet metrics
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # kubelet / cAdvisor (pod CPU+RAM)
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # kube-state-metrics
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kube-state-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http-metrics

      # node-exporter (host CPU, RAM, disk, network)
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

      # Tencent Cloud VM's node_exporter — see tencent-server-observability.md.
      # Needs its own job_name (Prometheus requires these to be unique), but
      # relabeled to job="node-exporter" so it lands under the same dashboard
      # filter as matflix-server. Putting a static_configs target inside the
      # job above instead silently dropped it: that job's relabel_configs does
      # `keep` on __meta_kubernetes_service_name, a label that only exists for
      # kubernetes_sd_configs-discovered targets — for a static target it's
      # absent, the regex match fails against an empty string, and `keep`
      # drops it before it's ever scraped (not even reported as down).
      # Public IP, restricted at the Security Group level to the home IP
      # (same CIDR as SSH); node_exporter itself has no auth of its own.
      - job_name: 'node-exporter-tencent'
        static_configs:
          - targets: ['162.62.135.86:9100']
        relabel_configs:
          - target_label: job
            replacement: node-exporter
          - target_label: location
            replacement: tencent-cloud

      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Traefik metrics
      - job_name: 'traefik'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: traefik
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9100
