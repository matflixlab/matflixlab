apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: matflixlab
  labels:
    app: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
      - name: umami
        image: ghcr.io/umami-software/umami:postgresql-latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: umami-secret
              key: database-url
        - name: APP_SECRET
          valueFrom:
            secretKeyRef:
              name: umami-secret
              key: app-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/heartbeat
            port: 3000
          initialDelaySeconds: 180
          periodSeconds: 60
          failureThreshold: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/heartbeat
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 10
          timeoutSeconds: 10
