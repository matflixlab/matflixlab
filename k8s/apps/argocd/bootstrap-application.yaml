# Self-referencing "app of apps" root: this Application manages the contents of
# k8s/apps/argocd itself (this file, the two ApplicationSets, the ingress, and the
# ArgoCD install manifest). Without it, changes to that directory require manual
# `kubectl apply` — the same gap the rest of this plan closed one layer down.
#
# One-time bootstrap (documented exception, same category as installing ArgoCD
# itself): apply this file once by hand —
#   kubectl apply -f k8s/apps/argocd/bootstrap-application.yaml
# — after that, ArgoCD reconciles this directory (including this Application
# resource) from git like everything else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:matflixlab/matflixlab.git
    targetRevision: master
    path: k8s/apps/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
