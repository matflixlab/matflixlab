apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matflixlab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:matflixlab/matflixlab.git
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: matflixlab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
