apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:matflixlab/matflixlab.git
        revision: master
        directories:
          - path: k8s/infrastructure/*
  template:
    metadata:
      name: 'infra-{{.path.basename}}'
      labels:
        app.kubernetes.io/managed-by: applicationset
        app.kubernetes.io/component: infrastructure
    spec:
      project: default
      source:
        repoURL: git@github.com:matflixlab/matflixlab.git
        targetRevision: master
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{if eq .path.basename "traefik"}}kube-system{{else}}matflixlab{{end}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
